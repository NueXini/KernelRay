name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # 创建 release 并上传 ZIP

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 打包 ./module，用 KernelSU Modules 校验器预检，然后以
      # draft -> upload -> publish 的顺序发布，让 release 整体不可变。
      # 把 action 钉死在完整 commit SHA 上（分支可以被移动；本步骤带着
      # `contents: write` 运行）。
      - uses: KernelSU-Modules/tools/actions/module-release@e0ac1a6193e698beac3c2fc47dec88d180efca8a
        id: release
        with:
          module-dir: module
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate-release-notes: true

      # 步骤输出经 env: 传递——绝不把 ${{ }} 表达式插值进 shell 脚本
      #（资产名含 module.prop 的版本，即作者可控文本）。
      - env:
          ASSET_NAME: ${{ steps.release.outputs.asset-name }}
          SHA256: ${{ steps.release.outputs.sha256 }}
          RELEASE_URL: ${{ steps.release.outputs.release-url }}
        run: |
          echo "Published ${ASSET_NAME}"
          echo "sha256 ${SHA256}"
          echo "${RELEASE_URL}"
