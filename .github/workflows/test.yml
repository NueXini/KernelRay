name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ubuntu-latest 自带 Node，这么小的测试不需要 setup action。
      # 解析器、节点列表模型与出站渲染器都从随包发布的
      # module/webroot/app.js 里抽取；config 测试对着假核心 source 随包
      # shell。
      - run: |
          node --version
          node --check module/webroot/app.js
          bash -n module/scripts/kernelray.sh
          node tests/parse.test.js
          node tests/outbound.test.js
          node tests/nodelist.test.js
          node tests/link.test.js
          node tests/config.test.js
          node tests/routing.test.js
          node tests/adblock.test.js
