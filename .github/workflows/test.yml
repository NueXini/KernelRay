name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node ships with ubuntu-latest, so no setup action is needed for a test this small.
      # The parser is extracted from module/webroot/app.js, i.e. the file that ships.
      - run: node --version && node tests/parse.test.js
