name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: |
          node --version
          node --check module/webroot/app.js
          bash -n module/scripts/kernelray.sh
          node tests/parse.test.js
          node tests/outbound.test.js
          node tests/nodelist.test.js
          node tests/link.test.js
          node tests/config.test.js
          node tests/routing.test.js
          node tests/adblock.test.js

      - run: |
          curl -LO https://github.com/XTLS/Xray-core/releases/latest/download/Xray-android-arm64-v8a.zip
          unzip -j Xray-android-arm64-v8a.zip xray -d module/bin/
          rm Xray-android-arm64-v8a.zip
          curl -LO https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          curl -LO https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          mv geosite.dat geoip.dat module/bin/

      - id: pack
        run: echo "zip=$(scripts/pack.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: KernelRay-zip
          path: ${{ steps.pack.outputs.zip }}
          retention-days: 7
