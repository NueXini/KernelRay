name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: |
          node --version
          node --check module/webroot/app.js
          bash -n module/customize.sh module/scripts/kernelray.sh \
            module/scripts/tproxy.sh module/uninstall.sh
          node --test tests/*.test.js

      # customize.sh 带 `# shellcheck shell=ash` 指令：模块脚本跑在
      # busybox ash 里，按 ash 方言检查。-S warning 滤掉 info 级的
      # SC2086/SC2013（受控值上的有意分词），-e SC2034,SC1091 排除
      # 跨文件变量 API 与 source 路径的固有假阳性。
      - run: |
          shellcheck -s ash -S warning -e SC2034,SC1091 \
            module/customize.sh module/scripts/kernelray.sh \
            module/scripts/tproxy.sh module/uninstall.sh

      - run: |
          curl -LO https://github.com/XTLS/Xray-core/releases/latest/download/Xray-android-arm64-v8a.zip
          unzip -j Xray-android-arm64-v8a.zip xray -d module/bin/
          rm Xray-android-arm64-v8a.zip
          curl -LO https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          curl -LO https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          mv geosite.dat geoip.dat module/bin/

      - run: |
          sed -i "s/^version=.*/version=$(date -u +%y.%m.%d)/" module/module.prop
          sed -i "s/^versionCode=.*/versionCode=$(date -u +%y%m%d)/" module/module.prop

      - uses: actions/upload-artifact@v7
        with:
          name: KernelRay
          path: module
          retention-days: 7
