<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KernelRay</title>
<link rel="stylesheet" href="app.css">
<!-- Before the body paints: resolves the stored theme preference and stamps data-theme. -->
<script src="theme.js"></script>
</head>
<body>
<div class="banner" id="banner"></div>

<header>
  <h1>KernelRay</h1>
  <span class="badge" id="badge">…</span>
</header>

<main>
  <section class="page" id="page-status">
    <section class="card">
      <div class="row">
        <button class="primary" id="start" disabled>Start</button>
        <button class="danger" id="stop" disabled>Stop</button>
      </div>
      <div class="hint" id="hint"></div>
    </section>

    <section class="card" id="tp-card" hidden>
      <div class="hint" id="tp-hint"></div>
      <button type="button" class="primary mt" id="tp-retry" hidden>Retry</button>
    </section>

    <section class="card">
      <dl>
        <dt id="l-pid">PID</dt><dd id="v-pid">–</dd>
        <dt id="l-up">Uptime</dt><dd id="v-up">–</dd>
        <dt id="l-port">Ports</dt><dd id="v-port">–</dd>
        <dt id="l-core">Core</dt><dd id="v-core">–</dd>
        <dt id="l-conf">Config</dt><dd id="v-conf">–</dd>
      </dl>
    </section>
  </section>

  <section class="page" id="page-nodes" hidden>
    <section class="card" id="listcard">
      <div class="nodehead">
        <span id="l-nodes">Node list</span>
        <span class="spacer"></span>
        <button type="button" class="nedit" id="edit-node">Edit</button>
        <button type="button" class="iconbtn" id="add-node" aria-label="Add node">+</button>
      </div>
      <div class="nbatch" id="n-toolbar" hidden></div>
      <div class="nlist" id="n-list"></div>
      <div class="nodehint" id="n-hint"></div>
    </section>
  </section>

  <section class="page" id="page-log" hidden>
    <section class="card logcard">
      <div class="logbar">
        <span id="l-log">Log</span>
        <span class="spacer"></span>
        <label><input type="checkbox" id="follow" checked><span id="l-follow">Follow</span></label>
        <button id="refresh">Refresh</button>
      </div>
      <pre id="log">…</pre>
    </section>
  </section>

  <section class="page" id="page-settings" hidden>
    <section class="card">
      <div class="cardtitle" id="l-set-general">General</div>
      <div class="cardsec">
        <div class="setrow">
          <label class="setlabel" id="l-set-theme" for="sel-theme">Theme</label>
          <select id="sel-theme">
            <option value="auto" id="l-theme-auto">Auto</option>
            <option value="light" id="l-theme-light">Light</option>
            <option value="dark" id="l-theme-dark">Dark</option>
          </select>
        </div>
      </div>
      <div class="cardsec">
        <div class="setrow">
          <label class="setlabel" id="l-set-lang" for="sel-lang">Language</label>
          <select id="sel-lang">
            <option value="auto" id="l-lang-auto">Auto</option>
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
        </div>
      </div>
      <div class="cardsec">
        <div class="setrow">
          <label class="setlabel" id="l-set-log" for="sel-log">Log buffer</label>
          <select id="sel-log">
            <option value="100">100</option>
            <option value="200">200</option>
            <option value="500">500</option>
          </select>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="tp-row">
        <div class="tp-text">
          <span id="l-set-tp">tproxy transparent proxy</span>
          <div class="hint" id="set-tp-hint"></div>
        </div>
        <button type="button" class="switch" id="set-tp-switch" role="switch"
                aria-checked="false"><span class="knob"></span></button>
      </div>
    </section>

    <section class="card">
      <div class="nodehead">
        <span id="l-set-ports">Inbound ports</span>
      </div>
      <div class="ports">
        <label class="portfield">
          <span>SOCKS</span>
          <input type="number" id="i-socks" inputmode="numeric" min="1" max="65535"
                 autocomplete="off" disabled>
        </label>
        <label class="portfield">
          <span>HTTP</span>
          <input type="number" id="i-http" inputmode="numeric" min="1" max="65535"
                 autocomplete="off" disabled>
        </label>
      </div>
      <button type="button" class="primary mt" id="ports-save" disabled>Save</button>
      <div class="hint" id="l-set-ports-hint"></div>
    </section>

    <section class="card">
      <div class="hint" id="l-set-soon"></div>
    </section>
  </section>
</main>

<nav class="tabbar" id="tabbar" aria-label="Sections">
  <div class="tabbar-inner">
    <a class="tab" href="#/status" data-route="status" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12h4l2.5-6 5 12 2.5-6h4"/>
      </svg>
      <span class="tab-label" id="l-tab-status">Status</span>
    </a>
    <a class="tab" href="#/nodes" data-route="nodes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="7" rx="2"/>
        <rect x="3" y="13" width="18" height="7" rx="2"/>
        <path d="M7 7.5h.01M7 16.5h.01"/>
      </svg>
      <span class="tab-label" id="l-tab-nodes">Nodes</span>
    </a>
    <a class="tab" href="#/log" data-route="log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <path d="M7 9l3 3-3 3M13 15h4"/>
      </svg>
      <span class="tab-label" id="l-tab-log">Log</span>
    </a>
    <a class="tab" href="#/settings" data-route="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 6h10M17 6h4M3 12h4M11 12h10M3 18h12M19 18h2"/>
        <circle cx="15" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>
      </svg>
      <span class="tab-label" id="l-tab-settings">Settings</span>
    </a>
  </div>
</nav>

<div class="overlay" id="add-overlay" hidden>
  <section class="card addcard" role="dialog" aria-modal="true" aria-labelledby="l-import">
    <div class="nodehead">
      <span id="l-import">Add node</span>
      <span class="spacer"></span>
      <button type="button" class="iconbtn" id="add-close" aria-label="Close">×</button>
    </div>
    <textarea id="i-text" rows="3" spellcheck="false" autocapitalize="off"
              autocomplete="off" autocorrect="off" placeholder="vless://…"></textarea>
    <button type="button" class="primary mt" id="i-apply" disabled>Import</button>
    <div class="nodehint" id="i-hint"></div>
    <div id="i-preview"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
